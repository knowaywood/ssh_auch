name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Build inside a manylinux image so the binary only requires glibc 2.28.
      # Alibaba Cloud Linux 3 currently provides glibc 2.32; the default
      # ubuntu-22.04 runner links against glibc 2.35 and is not compatible.
      - name: Build in a glibc-compatible environment
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/io" \
            -w /io \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -lc '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source /root/.cargo/env
              cargo build --release
            '

      - name: Package
        run: |
          mkdir -p package
          cp target/release/ssh_auth package/ssh_auth
          cp config.example.toml package/config.example.toml
          tar -czf ssh_auth-linux-x86_64.tar.gz -C package ssh_auth config.example.toml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ssh_auth-linux-x86_64.tar.gz
