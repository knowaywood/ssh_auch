name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p package
          cp target/release/ssh_auth package/ssh_auth
          cp config.example.toml package/config.example.toml
          tar -czf ssh_auth-linux-x86_64.tar.gz -C package ssh_auth config.example.toml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ssh_auth-linux-x86_64.tar.gz
